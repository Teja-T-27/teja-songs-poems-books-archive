<html lang="en">
<head>

<style>
  :root {
    --bg: #12100E;
    --paper: #F0E9DC;
    --ink: #F0E9DC;
    --dim: #8F887F;
    --rule: #2A2622;
    --accent: #D4A24C;
    --card-bg: #1A1613;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 0 24px;
    min-height: 100vh;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 72px 0 128px; }

  header.mast {
    padding-bottom: 40px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
  }
  .mast-left { max-width: 640px; }
  .eyebrow {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }
  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(48px, 9vw, 96px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    font-variation-settings: "opsz" 144;
  }
  .mast-right {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 15px;
    color: var(--dim);
    text-align: right;
    font-variation-settings: "opsz" 16;
  }
  .count { color: var(--accent); font-style: normal; }

  .search-wrap { margin-bottom: 48px; }
  input.search {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 20px;
    padding: 12px 0;
    outline: none;
    transition: border-color 0.2s;
    font-variation-settings: "opsz" 20;
  }
  input.search::placeholder {
    color: var(--dim);
    font-style: italic;
  }
  input.search:focus { border-bottom-color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 32px 24px;
  }
  .card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); }
  .card:hover .thumb::after { opacity: 1; }
  .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--card-bg);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(212, 162, 76, 0.15), transparent 60%);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  .play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px;
    background: rgba(18, 16, 14, 0.75);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .card:hover .play { opacity: 1; }
  .play::before {
    content: '';
    display: block;
    width: 0; height: 0;
    border-left: 12px solid var(--paper);
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    margin-left: 3px;
  }
  .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: var(--paper);
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-variation-settings: "opsz" 24;
  }
  .card-channel {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--dim);
    font-weight: 300;
  }
  .empty {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--dim);
    text-align: center;
    padding: 80px 0;
    grid-column: 1 / -1;
  }

  footer {
    margin-top: 96px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  @media (max-width: 640px) {
    body { padding: 0 16px; }
    .wrap { padding: 40px 0 80px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
    .card-title { font-size: 14px; }
    header.mast { flex-direction: column; align-items: flex-start; }
    .mast-right { text-align: left; }
  }
</style>
</head>

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const countEl = document.getElementById('count');
  const shuffleBtn = document.getElementById('shuffle');

  let displayed = [...SONGS];

  function render(list) {
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty">nothing here — try a different word</div>';
      return;
    }
    grid.innerHTML = list.map(s => `
      <a class="card" href="https://youtube.com/watch?v=${s.id}" target="_blank" rel="noopener">
        <div class="thumb">
          <img src="https://i.ytimg.com/vi/${s.id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.display='none'">
          <div class="play"></div>
        </div>
        <div class="card-title">${escapeHtml(s.title)}</div>
        <div class="card-channel">${escapeHtml(s.channel)}</div>
      </a>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  search.addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { render(displayed); return; }
    const filtered = displayed.filter(s =>
      s.title.toLowerCase().includes(q) || s.channel.toLowerCase().includes(q)
    );
    render(filtered);
  });

  shuffleBtn.addEventListener('click', e => {
    e.preventDefault();
    displayed = [...displayed].sort(() => Math.random() - 0.5);
    search.value = '';
    render(displayed);
  });

  countEl.textContent = SONGS.length;
  render(displayed);
</script>
